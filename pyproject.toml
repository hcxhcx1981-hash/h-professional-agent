[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "h-professional-agent"
version = "0.1.0"
requires-python = ">=3.11"
description = "Project-scoped thin adapters for Hermes, Capsule, Memory OS and DHAF"
dependencies = ["capsule-ctrl @ git+https://github.com/realbakari/capsule.git@6492d704f9d389233038ee35630940acba7c2f2f"]

[tool.setuptools.packages.find]
include = ["hpa*"]

[tool.setuptools.package-data]
hpa = ["*.json"]
