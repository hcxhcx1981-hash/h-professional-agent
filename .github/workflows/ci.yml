name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: "3.11"

      - name: Install build tooling
        run: python -m pip install build

      - name: Compile check
        run: python -m compileall -q hpa tests

      - name: Portable unit tests
        run: >
          python -B -m unittest -v
          tests.test_capability
          tests.test_continuation
          tests.test_discovery
          tests.test_evidence
          tests.test_registry
          tests.test_registry_bootstrap
          tests.test_specialist
          tests.test_task_routing

      - name: Build wheel
        run: python -m build --wheel --no-isolation
